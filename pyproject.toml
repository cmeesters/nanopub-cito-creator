[tool.poetry]
name = "nanopub-cito-creator"
version = "0.1.0"
description = "An application for creating citation ontologies (CiTOs) from academic papers"
authors = ["Christian Meesters <meesters@uni-mainz.de>"]
license = "Apache"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
wxPython = ">=4.2.0"
nanopub = ">=2.0.0"
rdflib = ">=6.0.0"
requests = ">=2.28.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.0"
pytest-cov = ">=7.0.0"
requests-mock = ">=1.12.0"
black = ">=23.0.0"
flake8 = ">=6.0.0"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
